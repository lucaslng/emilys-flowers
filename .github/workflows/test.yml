name: Tests

# Test pipeline (changes/unit/e2e). Runs on pull_request and as a reusable
# workflow called by deploy.yml. The `changes` job's diff base follows the
# triggering event: PR base SHA for pull_request, before-SHA for push.
#
# Unit tests always run; E2E runs only when app/e2e-affecting files change
# (see the `changes` job filter).
on:
  workflow_call:
    outputs:
      unit-result:
        description: Result of the unit job (success/failure/cancelled)
        value: ${{ jobs.unit.outputs.result }}
      e2e-result:
        description: Result of the e2e job (success/failure/cancelled; empty when skipped)
        value: ${{ jobs.e2e.outputs.result }}
    secrets:
      STRIPE_SECRET_KEY_TEST:
        required: true
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect e2e-relevant changes
        id: filter
        shell: bash
        run: |
          # Diff base: PR base SHA for pull_request, before-SHA for push.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # First push: before is all-zeros → diff against origin/main.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="origin/main"
          fi

          # Fail safe: if the diff can't be computed, run E2E.
          if ! DIFF=$(git diff --name-only "$BASE" 2>/dev/null); then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # E2E runs when any app/e2e-affecting file changes.
          if echo "$DIFF" | grep -E \
            '^src/|^e2e/|^public/|^playwright\.config\.ts$|^next\.config\.ts$|^tsconfig\.json$|^package\.json$|^bun\.lock$|^\.github/workflows/' \
            >/dev/null; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun test

      # Expose the job result as a workflow_call output. `job.status` is used
      # because `jobs.<job>.result` in output values is buggy (actions/runner#2495).
      # `always()` sets the output even on failure; a cancelled job leaves it empty.
      - name: Report job result
        id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E tests
    needs: [changes]
    # E2E runs for PR feedback (standalone pull_request trigger) and for
    # production deploys (workflow_call from deploy.yml on main — the only
    # consumer of the e2e result). On non-main pushes the deploy.yml call only
    # needs unit results (previews gate on unit-result), so skip the ~10 min
    # suite there instead of discarding it. In a called workflow `github.ref`
    # reflects the caller's ref and `github.event_name` the caller's event.
    if: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        # Stripe key feeds the build-time catalog fetch; the served app runs
        # with an empty key so /api/checkout stays in simulated-success mode.
        env:
          STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Expose the job result as an output. Skipped jobs run no steps,
      # leaving the output empty.
      - name: Report job result
        id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"
