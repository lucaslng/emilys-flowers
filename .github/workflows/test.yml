name: Tests

# Single source of truth for the test jobs (changes/unit/e2e). Runs standalone
# on pull_request for fast PR feedback AND is called as a reusable workflow by
# deploy.yml on push, so the tests (and the e2e path-filter) exist in exactly
# one place. The `changes` job's diff base adapts to the caller's event: PR
# base SHA when PR-triggered, before-SHA when called from a push-triggered
# workflow.
#
# Unit tests always run (cheap, fast gate). E2E runs only when app/e2e-affecting
# files change (see the `changes` job filter) — docs/config-only PRs skip E2E.
on:
  workflow_call:
    outputs:
      unit-result:
        description: Result of the unit job (success/failure/cancelled)
        value: ${{ jobs.unit.outputs.result }}
      e2e-result:
        description: Result of the e2e job (success/failure/cancelled; empty when skipped)
        value: ${{ jobs.e2e.outputs.result }}
    secrets:
      STRIPE_SECRET_KEY_TEST:
        required: true
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect e2e-relevant changes
        id: filter
        shell: bash
        run: |
          # Diff base: PR base SHA for pull_request, before-SHA for push.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # New branch / first push: before is all-zeros → diff against the
          # default branch (origin/main) instead of guessing. The fail-safe
          # below covers the case where that diff can't be computed either.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="origin/main"
          fi

          # Fail safe: if the diff can't be computed, run E2E.
          if ! DIFF=$(git diff --name-only "$BASE" 2>/dev/null); then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # E2E runs when any app/e2e-affecting file changes.
          if echo "$DIFF" | grep -E \
            '^src/|^e2e/|^public/|^playwright\.config\.ts$|^next\.config\.ts$|^tsconfig\.json$|^package\.json$|^bun\.lock$|^\.github/workflows/' \
            >/dev/null; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

      # Expose the job result as a workflow_call output. `job.status` is the
      # reliable signal — the `jobs.<job>.result` expression in output values
      # is buggy (actions/runner#2495/#3087). `always()` so the output is set
      # even when the tests fail; a cancelled job runs no steps, leaving the
      # output empty, which callers treat as "blocked".
      - name: Report job result
        id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E tests
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        # STRIPE_SECRET_KEY_TEST feeds the build (the catalog is fetched from
        # Stripe at build time); playwright.config.ts runs the served app with an
        # empty key so /api/checkout stays in simulated-success mode and never
        # hits the real Stripe API.
        env:
          STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Same pattern as the unit job: expose the job result as an output. When
      # this job is skipped (path-filtered out) no steps run, so the output is
      # empty — callers must not treat empty as "skipped".
      - name: Report job result
        id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"
