name: Deploy

# Vercel-like branch model: `main` → production Worker (live Stripe keys),
# every other branch → preview Worker (test Stripe keys). Runtime secrets
# (STRIPE_SECRET_KEY) are set per Worker via `wrangler secret put --env <name>`
# and never enter GitHub — only the publishable keys (safe to expose) and the
# Cloudflare API token live in GitHub Secrets. `--keep-vars` prevents deploys
# from deleting those dashboard-set secrets.
#
# Tests live here (not in test.yml) so they gate deploys. test.yml handles
# PR-only feedback; this workflow handles push events (tests + deploy).

on:
  push:
    branches: ['**']

# Prevent overlapping deploys. Production deploys are never cancelled mid-flight;
# preview deploys for the same branch cancel older runs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        # playwright.config.ts prefixes the webServer command with
        # `STRIPE_SECRET_KEY=` so /api/checkout runs in simulated-success mode
        # and never hits the real Stripe API.
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy-production:
    name: Deploy → production
    needs: [unit, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NEXT_PUBLIC_* is inlined by Next.js at build time, so the publishable
      # key must be present during the OpenNext build.
      - name: Build (OpenNext)
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE }}
        run: bunx opennextjs-cloudflare build

      # `--keep-vars` preserves dashboard-set runtime secrets (STRIPE_SECRET_KEY)
      # that aren't declared in wrangler.jsonc. Without it, wrangler deletes them.
      - name: Deploy to production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx opennextjs-cloudflare deploy --env production -- --keep-vars

  deploy-preview:
    name: Deploy → preview
    needs: [unit, e2e]
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (OpenNext)
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST }}
        run: bunx opennextjs-cloudflare build

      - name: Deploy to preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx opennextjs-cloudflare deploy --env preview -- --keep-vars