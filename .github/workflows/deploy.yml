name: Deploy

# Vercel-like branch model: `main` → production Worker (live Stripe keys),
# every other branch → preview Worker (test Stripe keys). Runtime secrets
# (STRIPE_SECRET_KEY) are set per Worker via `wrangler secret put --env <name>`
# and never enter GitHub — only the publishable keys (safe to expose) and the
# Cloudflare API token live in GitHub Secrets. `--keep-vars` prevents deploys
# from deleting those dashboard-set secrets.
#
# Tests live here (not in test.yml) so they gate deploys. test.yml handles
# PR-only feedback; this workflow handles push events (tests + deploy).

on:
  push:
    branches: ['**']

# Prevent overlapping deploys. Production deploys are never cancelled mid-flight;
# preview deploys for the same branch cancel older runs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        # playwright.config.ts prefixes the webServer command with
        # `STRIPE_SECRET_KEY=` so /api/checkout runs in simulated-success mode
        # and never hits the real Stripe API.
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy-production:
    name: Deploy → production
    needs: [unit, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NEXT_PUBLIC_* is inlined by Next.js at build time, so the publishable
      # key must be present during the OpenNext build.
      - name: Build (OpenNext)
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE }}
        run: bunx opennextjs-cloudflare build

      # `--keep-vars` preserves dashboard-set runtime secrets (STRIPE_SECRET_KEY)
      # that aren't declared in wrangler.jsonc. Without it, wrangler deletes them.
      - name: Deploy to production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx opennextjs-cloudflare deploy --env production -- --keep-vars

  deploy-preview:
    name: Deploy → preview
    needs: [unit, e2e]
    if: github.ref != 'refs/heads/main'
    # Job-scoped (least privilege): the other jobs keep the workflow-level
    # `contents: read`. `pull-requests: write` lets this job look up the PR
    # for the head SHA and post/update a sticky preview-URL comment on it.
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (OpenNext)
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST }}
        run: bunx opennextjs-cloudflare build

      # Use `upload` (wrangler versions upload) instead of `deploy` so each
      # branch gets its own preview version with a stable URL, rather than
      # overwriting the preview Worker's production deployment. The alias
      # produces a URL like `<alias>-emilys-flowers-preview.<subdomain>.workers.dev`.
      - name: Deploy to preview Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Sanitize branch name for DNS: lowercase, replace / _ . with -, squeeze
          # consecutive hyphens, strip leading/trailing -, truncate to 40 chars
          # (workers.dev subdomain label limit is 63; worker name is 22 + 1 hyphen).
          ALIAS=$(echo "${{ github.ref_name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | tr '/_.' '-' \
            | tr -s '-' \
            | sed 's/^-//;s/-$//' \
            | cut -c1-40 \
            | sed 's/-$//')
          URL="https://${ALIAS}-emilys-flowers-preview.lucaslng.workers.dev"
          echo "Preview URL: ${URL}"
          # Surface to the comment step below. $GITHUB_OUTPUT is the supported
          # channel for step outputs in composite/run steps (set-output is deprecated).
          echo "preview-url=${URL}" >> "$GITHUB_OUTPUT"
          bunx opennextjs-cloudflare upload --env preview -- --keep-vars --preview-alias "$ALIAS"

      # This workflow triggers on `push`, not `pull_request`, so
      # github.event.pull_request is unavailable. Look up the PR (if any) for
      # the head SHA via the REST API. Returns the PR number as a string step
      # output, or an empty string when the branch has no open PR — in which
      # case the comment step is skipped (no PR to comment on).
      - name: Find PR for this commit
        id: pr
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            // Prefer the first OPEN PR; fall back to the first result if none are open.
            const pr = prs.data.find(p => p.state === 'open') ?? prs.data[0];
            return pr ? String(pr.number) : '';

      # Sticky: keyed by `header`, so re-pushes UPDATE the same comment instead
      # of stacking duplicates. Skipped when no PR was found (e.g. a branch
      # pushed without an open PR). `if` is a GitHub Actions expression, so the
      # empty-string check is truthy-only.
      - name: Comment preview URL on PR
        if: steps.pr.outputs.result != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.pr.outputs.result }}
          header: cloudflare-preview-url
          message: |
            ## ☁️ Cloudflare preview deployed

            Push `${{ github.sha.substring(0, 7) }}` on `${{ github.ref_name }}` is live at:

            **${{ steps.deploy.outputs.preview-url }}**

            <sub>Test Stripe keys · auto-updated on each push · from `deploy.yml`</sub>