name: Deploy

# Branch model: `main` → production Worker (live Stripe keys), other
# branches → preview Worker (test keys). Runtime secrets are set per Worker
# via `wrangler secret put`; `--keep-vars` preserves them on deploy.
#
# Tests run via the reusable `.github/workflows/test.yml`. Production deploys
# when the whole tests run succeeds (unit passed AND e2e passed or skipped);
# previews gate on `unit-result` only.

on:
  workflow_dispatch:
  push:
    branches: ['**']

# Prevent overlapping deploys. Production deploys are never cancelled mid-flight;
# preview deploys for the same branch cancel older runs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  deploy-production:
    name: Deploy → production
    needs: [tests]
    # Called workflow succeeds only when unit passed AND (e2e passed or skipped).
    # `!cancelled()` keeps the check explicit when the tests run fails or is cancelled.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Restore bun cache
        id: bun-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Save bun cache
        if: always() && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      # NEXT_PUBLIC_* is inlined at build time; STRIPE_SECRET_KEY feeds the
      # build-time Stripe catalog fetch. UNDER_CONSTRUCTION_ENABLED marks the
      # production build — only it evaluates the Flagship `under-construction` flag.
      - name: Build (OpenNext)
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_LIVE }}
          UNDER_CONSTRUCTION_ENABLED: "true"
          FLAGSHIP_APP_ID: ${{ secrets.FLAGSHIP_APP_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx opennextjs-cloudflare build

      # Populate the static-assets cache (open-next.config.ts) so the worker
      # serves the build-time prerendered pages (with baked-in Flagship flags).
      - name: Populate static-assets cache
        run: bunx opennextjs-cloudflare populateCache local

      # `--keep-vars` preserves dashboard-set runtime secrets not declared in wrangler.jsonc.
      - name: Deploy to production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx opennextjs-cloudflare deploy --env production -- --keep-vars

  deploy-preview:
    name: Deploy → preview
    needs: [tests]
    # Gate on unit tests only — e2e never blocks previews. `!cancelled()` evaluates
    # the output check even when the tests run failed.
    if: ${{ !cancelled() && github.ref != 'refs/heads/main' && needs.tests.outputs.unit-result == 'success' }}
    # `pull-requests: write` lets this job post/update the preview-URL comment.
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Restore bun cache
        id: bun-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Save bun cache
        if: always() && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      - name: Build (OpenNext)
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          FLAGSHIP_APP_ID: ${{ secrets.FLAGSHIP_APP_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx opennextjs-cloudflare build

      # Populate the static-assets cache so previews serve the prerendered pages.
      - name: Populate static-assets cache
        run: bunx opennextjs-cloudflare populateCache local

      # `upload` gives each branch its own preview version with a stable URL
      # (`<alias>-emilys-flowers-preview.<subdomain>.workers.dev`).
      - name: Deploy to preview Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Sanitize branch name for DNS (lowercase, /_. → -, ≤40 chars).
          ALIAS=$(echo "${{ github.ref_name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | tr '/_.' '-' \
            | tr -s '-' \
            | sed 's/^-//;s/-$//' \
            | cut -c1-40 \
            | sed 's/-$//')
          URL="https://${ALIAS}-emilys-flowers-preview.lucaslng.workers.dev"
          echo "Preview URL: ${URL}"
          # Surface preview URL and short SHA to the comment step via $GITHUB_OUTPUT.
          echo "preview-url=${URL}" >> "$GITHUB_OUTPUT"
          echo "short-sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          bunx opennextjs-cloudflare upload --env preview -- --keep-vars --preview-alias "$ALIAS"

      # Push-triggered, so github.event.pull_request is unavailable — look up the
      # PR for the head SHA via the REST API (empty when none exists).
      - name: Find PR for this commit
        id: pr
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            // Prefer the first OPEN PR; fall back to the first result if none are open.
            const pr = prs.data.find(p => p.state === 'open') ?? prs.data[0];
            return pr ? String(pr.number) : '';

      # Sticky: keyed by `header`, so re-pushes update the same comment.
      - name: Comment preview URL on PR
        if: steps.pr.outputs.result != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.pr.outputs.result }}
          header: cloudflare-preview-url
          message: |
            ## ☁️ Cloudflare preview deployed

            Push `${{ steps.deploy.outputs.short-sha }}` on `${{ github.ref_name }}` is live at:

            **${{ steps.deploy.outputs.preview-url }}**

            <sub>Test Stripe keys · auto-updated on each push · from `deploy.yml`</sub>
